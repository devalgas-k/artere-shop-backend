databaseChangeLog:
  - changeSet:
      id: devalgas-20260528-03
      author: devalgas
      changes:
        - addForeignKeyConstraint:
            baseTableName: category
            baseColumnNames: parent_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_category_parent
        - addPrimaryKey:
            tableName: category_product
            columnNames: category_id, product_id
            constraintName: pk_category_product
        - addForeignKeyConstraint:
            baseTableName: category_product
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_catprod_category
        - addForeignKeyConstraint:
            baseTableName: category_product
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_catprod_product
        - addForeignKeyConstraint:
            baseTableName: cart_item
            baseColumnNames: cart_id
            referencedTableName: cart
            referencedColumnNames: id
            constraintName: fk_cartitem_cart
        - addForeignKeyConstraint:
            baseTableName: cart_item
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_cartitem_product
